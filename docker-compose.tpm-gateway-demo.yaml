services:
  app:
    image: python:3.12-slim
    container_name: tpm-demo-app
    working_dir: /workspace
    command: ["python3", "/workspace/demo/tpm_http_app.py"]
    volumes:
      - .:/workspace:ro
    expose:
      - "8080"

  tpm-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tpm-gateway-demo
    depends_on:
      - app
    working_dir: /opt/shared
    command: ["/opt/start_tpm_gateway_container.sh"]
    environment:
      - UPSTREAM_BASE_URL=http://app:8080
      - TPM_GATEWAY_API_PORT=8000
      - TPM_GATEWAY_HTTPS_PORT=8443
      - TSS2_TCTI=swtpm:host=127.0.0.1,port=2321
      - TPM2TOOLS_TCTI=swtpm:host=127.0.0.1,port=2321
      - TPM2OPENSSL_TCTI=swtpm:host=127.0.0.1,port=2321
      - SWTPM_SERVER_PORT=2321
      - SWTPM_CTRL_PORT=2322
      - TPM_STATE_DIR=/tmp/tpm2-emulated
      - TPM_GATEWAY_WORK_DIR=/opt/shared
    ports:
      - "8001:8000"
      - "8443:8443"
      - "2321:2321"
      - "2322:2322"
    volumes:
      - ./multiple-instances/tpm_shared_dir1:/opt/shared
      - ./multiple-instances/tpm_shared_dir1/tpm_state:/tmp/tpm2-emulated
